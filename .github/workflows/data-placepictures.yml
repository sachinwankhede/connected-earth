name: data-placepictures
# Manual only, no schedule (#887, docs/DATA-PLAN.md step 4). The ONE job that finds pictures for places without one. It replaces data-photos, data-commonsplacephotos, data-commonsnearby, data-commonscategory and data-openverseplaces:
# the five sources are its strategies, tried in that order, and a place stops at the first accepted picture (jobs/placepictures.py). Everything is written through lib/place_photos.py, keyed by place id.
# It needs the id-keyed files made by data-photos-rekey and refuses to run on the old title-keyed ones. A CC BY / CC BY-SA picture with no author is refused. A run that finds nothing and changes no retry ledger opens no pull request.
# strategy = all runs every source in order; or name one (wikipedia, commons, nearby, category, openverse). dry = yes prints what would be kept and writes nothing.
on:
  workflow_dispatch:
    inputs:
      strategy: { description: "all, or one of: wikipedia, commons, nearby, category, openverse", default: "all" }
      limit: { description: "Places to try per strategy (0 = all left)", default: "120" }
      dry: { description: "yes = only print what would be kept, write nothing and open no pull request", default: "yes" }
      again: { description: "yes = also try places a source tried inside its hold (90 days; wikipedia: until the record expires)", default: "no" }
permissions:
  contents: write
  pull-requests: write
concurrency: data-photos
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - run: pip install pillow
      - name: Stop while a photo pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|test("^data/(photos|dropunnamed|commons|largephoto|largeplacephoto|hostphoto|openverse|rekey|droppictures|fixcoords|placepictures)"))]|length')
          echo "open photo pull requests: $N"; echo "n=$N" >> "$GITHUB_OUTPUT"
      - name: Find the pictures
        id: find
        if: steps.open.outputs.n == '0'
        run: |
          set +e
          python3 jobs/placepictures.py --strategy "${{ github.event.inputs.strategy || 'all' }}" --limit "${{ github.event.inputs.limit || '120' }}" ${{ github.event.inputs.dry != 'no' && '--dry' || '' }} ${{ github.event.inputs.again == 'yes' && '--again' || '' }} | tee find.log | tail -150
          RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          [ "$RC" = "0" ] || [ "$RC" = "2" ] || exit "$RC"
      - name: Validate the new files
        if: steps.open.outputs.n == '0' && github.event.inputs.dry == 'no'
        run: |
          set -o pipefail
          python3 lib/photo_registry.py validate
          python3 build/validate_data.py | tail -20
      - name: Commit and open the pull request
        if: steps.open.outputs.n == '0' && github.event.inputs.dry == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/placepictures-${GITHUB_RUN_ID}"
          git add -A photos
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          NY=$(grep -c '^yes ' find.log || true); NR=$(grep -c '^refused ' find.log || true)
          git commit -m "Place pictures: $NY found (strategy ${{ github.event.inputs.strategy || 'all' }})"
          git push -f origin HEAD
          { printf 'Part of #887 (`docs/DATA-PLAN.md`, step 4). Automatic run of data-placepictures, strategy `%s`, limit `%s`.\n\n**Result:** %s pictures found, %s refused because a CC BY / CC BY-SA picture had no author (listed as `refused` in the run log), the rest recorded in `photos/places_tried.json` so each source tries them again only after its hold (90 days).\n\n**By source:**\n\n' "${{ github.event.inputs.strategy || 'all' }}" "${{ github.event.inputs.limit || '120' }}" "$NY" "$NR"; grep '^summary ' find.log | sed 's/^summary /- /'; printf '\n**Sources and licences:** Wikipedia and Wikidata (en.wikipedia.org, www.wikidata.org), Wikimedia Commons (commons.wikimedia.org, upload.wikimedia.org) and Openverse (api.openverse.org, its own thumbnail only), all already in `lib/allowed_sources.json`; only CC0, CC BY, CC BY-SA and public domain are kept (#421). Licences of the new pictures:\n\n'; grep '^yes ' find.log | awk -F' [|] ' '{print $2}' | sort | uniq -c | sed 's/^ *\([0-9]*\) \(.*\)$/- \2: \1/'; printf '\n**Spot check (10 of them):**\n\n'; NYS=$(( NY/10 > 0 ? NY/10 : 1 )); grep '^yes ' find.log | awk -v n="$NYS" 'n==1 || NR%n==1' | head -10 | sed 's/^yes /- /'; printf '\nFull list in the run log.\n\n_Generated by [Claude Code](https://claude.ai/code)_\n'; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Place pictures: $NY found (strategy ${{ github.event.inputs.strategy || 'all' }})" --body-file body.md
      - name: Say so when a source stopped the run
        if: steps.find.outputs.rc == '2'
        run: echo "A source stopped the run (throttled or refused); see the STOP line in the log." && exit 1
