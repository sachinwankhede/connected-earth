name: data-hostphotos
# Manual only. Downloads species pictures, shrinks them to 96 px WebP, and records author and licence. Opens one pull request; the owner (or Claude, with the owner's standing approval for picture batches) merges.
on:
  workflow_dispatch:
    inputs:
      place: { description: "Place id, or all", default: "gulf" }
      limit: { description: "Pictures to host (0 = all left)", default: "0" }
permissions:
  contents: write
  pull-requests: write
concurrency: data-hostphotos
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - run: pip install pillow
      - name: Host the pictures
        run: python3 pipeline/hostphotos.py "${{ github.event.inputs.place || 'gulf' }}" "${{ github.event.inputs.limit || '0' }}" | tee host.log | tail -5
      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/hostphotos-${GITHUB_RUN_ID}"
          git add photos/species photos/species_hosted.json photos/species_hosted_skipped.json photos/species_metadata.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          N=$(python3 -c "import json;print(len(json.load(open('photos/species_hosted.json'))))"); S=$(python3 -c "import json;print(len(json.load(open('photos/species_hosted_skipped.json'))))")
          SZ=$(du -sk photos/species | cut -f1)
          git commit -m "Hosted species pictures: $N so far, $S skipped (${SZ} KB)"
          git push -f origin HEAD
          printf 'Part of #238. Automatic run of data-hostphotos for place `%s`. %s pictures hosted in total, %s skipped (unknown or non-free licence, or no download), %s KB of images. The app does not use them until it is wired in.\n' "${{ github.event.inputs.place || 'gulf' }}" "$N" "$S" "$SZ" > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Hosted species pictures ($N so far)" --body-file body.md
