name: data-story-batch
# Manual only (#779 step c). Turns the judged story drafts on the branch `gemini-stories` into ONE data pull request: the first `n` drafts (id order) that the judge passed, written into the place files
# (the diff is the review; merging is the approval), with a body that lists the table, what the judge flagged, the sources and licences and the 10-item spot check (docs/PROMOTION.md). Never merges.
# The throttle: it refuses to start while a pull request from a `data/story-batch-*` branch is open, so the owner's review pace is the speed limit.
# No model call, no secret: GITHUB_TOKEN only (jobs/story_batch.py reads files). CI is started for the new branch the way data-promote does it.
on:
  workflow_dispatch:
    inputs:
      n: { description: "Stories in the batch (about 25: what can be read in one sitting)", default: "25" }
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency: data-story-batch
jobs:
  batch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      N: ${{ github.event.inputs.n || '25' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse to start while a story batch pull request is open
        run: |
          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName --jq '[.[]|select(.headRefName|startswith("data/story-batch-"))|.number]|join(" ")')
          [ -z "$OPEN" ] || { echo "A story batch pull request is still open (#$OPEN): review and merge or close it first."; exit 1; }
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/checkout@v5
        with: { ref: gemini-stories, path: drafts-src, persist-credentials: false }
      - name: Build the batch
        run: |
          case "$N" in ''|*[!0-9]*) echo "n must be a number"; exit 2;; esac
          [ "$N" -ge 1 ] && [ "$N" -le 50 ] || { echo "n must be 1 to 50"; exit 2; }
          python3 jobs/story_batch.py drafts-src --data data/places --n "$N" --body body.md || { rc=$?; [ "$rc" = 3 ] && { echo "Nothing qualifies: no judge-passed draft for a place without a story."; echo "NOTHING=1" >> "$GITHUB_ENV"; exit 0; }; exit $rc; }
          python3 build/validate.py $(ls data/places/*.json) | tee validate.log
          ! grep -q "ERROR" validate.log
      - name: Commit and open the pull request
        if: env.NOTHING != '1'
        run: |
          COUNT=$(git diff --name-only -- data/places | wc -l)
          BR="data/story-batch-${GITHUB_RUN_ID}"
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BR"
          git add -- data/places
          git commit -m "Stories: $COUNT places from the judged Gemini drafts (#779)"
          git push -f origin "$BR"
          gh pr create --base main --head "$BR" --title "Stories for $COUNT places (judged Gemini drafts, #779)" --body-file body.md
          gh workflow run ci.yml --ref "$BR"
