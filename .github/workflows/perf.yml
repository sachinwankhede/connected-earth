name: perf
# Manual only. Loads the live site in a real browser on a GitHub runner (phone profile and desktop profile) and times the first load and the taps
# (filters, state parks, open and back for a place and a journey). The result is added to the history on the branch "perf-data" (no pull request, nothing
# to merge, never blocks anything) and shown in the run summary. Runs every night; when a metric is marked worse, it opens (or comments on) one issue called "Site got slower". A metric more than 15% worse than the last run is marked.
on:
  schedule:
    - cron: '17 8 * * *'   # every night, about 3 am in St. Louis
  workflow_dispatch:
    inputs:
      url: { description: "Page to test", default: "https://sachinwankhede.github.io/connected-earth/" }
      runs: { description: "Runs per profile (the median is kept)", default: "5" }
permissions:
  contents: write
  issues: write
concurrency: perf
jobs:
  perf:
    if: github.ref != 'refs/heads/sachinwankhede-profile-explore-setup'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Get the history from the perf-data branch
        run: |
          if git ls-remote --exit-code --heads origin perf-data >/dev/null 2>&1; then
            git clone --depth 1 --branch perf-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" perf-data
          else
            mkdir perf-data; git -C perf-data init -q -b perf-data
            git -C perf-data remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            echo '[]' > perf-data/history.json
          fi
      - name: Measure
        run: node tests/perf/perf.mjs --url "${{ github.event.inputs.url || 'https://sachinwankhede.github.io/connected-earth/' }}" --runs "${{ github.event.inputs.runs || '5' }}" --history perf-data/history.json --out perf-out.json --md perf-out.md
      - name: Summary
        run: cat perf-out.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save to the perf-data branch
        run: |
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('perf-data/history.json','utf8'));h.push(JSON.parse(fs.readFileSync('perf-out.json','utf8')));fs.writeFileSync('perf-data/history.json',JSON.stringify(h))"
          cp perf-out.md perf-data/latest.md
          cd perf-data
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git add history.json latest.md
          git commit -q -m "perf: $(date -u +%F' '%H:%M) UTC"
          if ! OUT=$(git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/perf-data 2>&1); then
            echo "::error::push failed: $(echo "$OUT" | tr '\n' ' ' | sed 's/x-access-token:[^@]*@//')"; exit 1
          fi
      - name: Open an issue when something got slower
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '⚠' perf-out.md; then
            { echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; echo "Lines marked with a warning sign are more than 15% worse than the previous run:"; echo; grep '⚠' perf-out.md; } > issue.md
            N=$(gh issue list --state open --search '"Site got slower" in:title' --json number --jq '.[0].number')
            if [ -n "$N" ]; then gh issue comment "$N" --body-file issue.md; else gh issue create --title "Site got slower" --body-file issue.md; fi
          fi

  explore-layout-profile:
    if: github.ref == 'refs/heads/sachinwankhede-profile-explore-setup'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 build/build.py --all
      - name: Measure cold and warm Explore layouts
        run: node tests/perf/explore-cache-profile.mjs --runs 5 | tee explore-layout-profile.txt >> "$GITHUB_STEP_SUMMARY"
