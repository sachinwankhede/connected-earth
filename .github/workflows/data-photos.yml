name: data-photos
# Runs daily and manually. Fetches the next batch of place photos (with author and licence) from Wikipedia and opens (or updates) one pull request.
# Nothing reaches the live site until that pull request is merged.
on:
  schedule:
    - cron: '17 12 * * *'   # daily at 12:17 UTC
  workflow_dispatch:
    inputs:
      limit: { description: "Places to try per round (0 = all left)", default: "120" }
      rounds: { description: "Rounds in this run; it stops early when nothing is left to try", default: "1" }
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency: data-photos
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Carry on from the open batch, if there is one
        run: |
          git checkout -B data/photos
          if [ -n "$(gh pr list --head data/photos --state open --json number --jq '.[0].number')" ]; then
            git fetch origin data/photos && git checkout origin/data/photos -- photos/places
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fetch the next batch of photos
        env:
          LIMIT: ${{ github.event_name == 'schedule' && '120' || github.event.inputs.limit || '120' }}
          ROUNDS: ${{ github.event_name == 'schedule' && '1' || github.event.inputs.rounds || '1' }}
        run: |
          for R in $(seq 1 "$ROUNDS"); do
            echo "== round $R"
            LIMIT="$LIMIT" python3 pipeline/photos.py photos/places data data-auto
            [ "$(cat photos/places/.tried)" = "0" ] && { echo "Nothing left to try."; break; }
          done
          rm -f photos/places/.tried
      - name: Commit and open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          N=$(python3 -c "import json;print(len(json.load(open('photos/places/places.json'))))")
          git commit -m "Place photos from Wikipedia: $N so far"
          git push -f origin data/photos
          if [ -z "$(gh pr list --head data/photos --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head data/photos --title "Place photos from Wikipedia (batch)" --body "Automatic batch from the data-photos workflow. Each photo is stored with its author and licence."
          fi
          gh workflow run ci.yml --ref data/photos
