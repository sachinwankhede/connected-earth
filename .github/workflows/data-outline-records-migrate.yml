name: data-outline-records-migrate
# One-time (manual) creation of the credit records of the existing park outlines (#977 step 3, docs/DATA-PLAN.md "Credits"). Runs jobs/outlinerecords_migrate.py (additive: no outline file changes), checks the
# result with the data validator, and opens ONE data pull request. Refuses while an outline or outline-records pull request is open. Delete this workflow and the job file after the migration has merged.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'dry run: print the counts, write nothing, open no pull request'
        default: 'yes'
        type: choice
        options: ['yes', 'no']
permissions:
  contents: write
  pull-requests: write
concurrency: data-outlines
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Stop while an outline pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|test("^data/(outline|bounds)"))]|length')
          echo "open outline pull requests: $N"; echo "n=$N" >> "$GITHUB_OUTPUT"
      - name: Create the outline records
        if: steps.open.outputs.n == '0'
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.dry }}" = "yes" ]; then python3 jobs/outlinerecords_migrate.py dry | tee migrate.log; exit 0; fi
          python3 jobs/outlinerecords_migrate.py | tee migrate.log
          python3 build/validate_data.py
      - name: Commit and open the pull request
        if: steps.open.outputs.n == '0' && github.event.inputs.dry == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/outline-records-${GITHUB_RUN_ID}"
          git add -A data/outline_records.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Outline records: one credit record per existing outline (#977)"
          git push -f origin HEAD
          { printf 'Part of #977 (and #887). One-time migration: every `data/outlines/<place id>.json` gets one credit record in `data/outline_records.json` (source from the file own `s` key, PAD-US when it has none; the licence of that source; `built` and `checkedAt`; no author, no expiry), in the shared shape of `docs/DATA-PLAN.md`. Additive: no outline file changes.\n\n'; sed -n '/^| Source/,$p' migrate.log; printf '\n**Sources and licences:** nothing new is added; PAD-US (public domain, US Geological Survey), Wikidata map boundaries (CC0), OpenStreetMap (ODbL, credited in the app).\n\n**Spot check:** the job checks every record against its file (source, licence, dates) and `build/validate_data.py` runs the same check (0 problems).\n\n_Generated by [Claude Code](https://claude.ai/code)_\n'; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Outline records: one credit record per existing outline" --body-file body.md
