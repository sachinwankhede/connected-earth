name: data-sync
# Manual only. Brings a data branch up to date with main (the same step every data job now runs before opening its pull request; see pipeline/syncstep.sh),
# rebuilds the species table, pushes, and starts the checks on the branch (a push from Actions does not start them by itself).
# Anything else that clashes stops the run so a person can look.
on:
  workflow_dispatch:
    inputs:
      branch: { description: "Branch to bring up to date (for example data/states-10b)", required: true }
permissions:
  contents: write
  actions: write
concurrency: data-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.event.inputs.branch }}", fetch-depth: 0 }
      - name: Merge main
        env:
          BR: ${{ github.event.inputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if bash pipeline/syncstep.sh; then
            git push origin "HEAD:$BR"
          else
            # say why on the pull request, because the job log cannot be read from outside
            N=$(gh pr list --head "$BR" --state open --json number --jq '.[0].number')
            [ -n "$N" ] && gh pr comment "$N" --body "data-sync could not finish: $(cat /tmp/sync.md)" || true
            exit 1
          fi
      - name: Start the checks
        env:
          GH_TOKEN: ${{ github.token }}
          BR: ${{ github.event.inputs.branch }}
        run: gh workflow run ci.yml --ref "$BR"
