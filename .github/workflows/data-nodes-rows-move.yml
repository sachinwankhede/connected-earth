name: data-nodes-rows-move
# One-time (manual) move of the rows of non-species nodes from data/species/rows to data/nodes/rows (#976 last step). Runs jobs/nodesrows_move.py, which also drops those ids from the species picture lists,
# checks the result with the data validator and opens ONE data pull request. Shares the concurrency group of the weekly photo jobs so the two never run together. Run it before the weekly species photo job
# (Tue 04:23 UTC) or after pausing that job. Delete this workflow and the job file after the move has merged.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'dry run: print the counts, write nothing, open no pull request'
        default: 'yes'
        type: choice
        options: ['yes', 'no']
permissions:
  contents: write
  pull-requests: write
concurrency: data-photos
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Stop while a species or node picture pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|test("^data/(species|node|photo)"))]|length')
          echo "open species or node picture pull requests: $N"; echo "n=$N" >> "$GITHUB_OUTPUT"
      - name: Move the node rows
        if: steps.open.outputs.n == '0'
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.dry }}" = "yes" ]; then python3 jobs/nodesrows_move.py dry | tee move.log; exit 0; fi
          python3 jobs/nodesrows_move.py | tee move.log
          python3 build/validate_data.py
          python3 build/species.py pack
          git diff --quiet -- data/places || { echo "pack changed place files: stopping"; exit 1; }
      - name: Commit and open the pull request
        if: steps.open.outputs.n == '0' && github.event.inputs.dry == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/nodes-rows-${GITHUB_RUN_ID}"
          git add -A data/species/rows data/nodes photos
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Node rows: move the rows of non-species nodes to data/nodes/rows (#976)"
          git push -f origin HEAD
          { printf 'Part of #976. One-time move: the 551 `sk: resource` rows of `data/species/rows` (sunlight, rain, soil, rivers, currents, deadwood fungi; owner ruling 16 Nov: concepts, not species) move unchanged to `data/nodes/rows`, and their ids leave the species picture lists (`photos/species_*.json` and the files only they showed). Their pictures are filed by node id (`photos/node_pictures.json`).\n\n%s\n\n**Sources and licences:** nothing new is added.\n\n**Spot check:** `build/validate_data.py` passes (0 problems), `build/species.py pack` changes no place file.\n\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$(cat move.log)"; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Node rows: move the rows of non-species nodes to data/nodes/rows" --body-file body.md
