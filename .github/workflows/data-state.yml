name: data-state
# Builds the next US state's parks (PAD-US list, GBIF species, GloBI feeding links) and opens one pull request for it.
# One state at a time: nothing new starts while a state pull request is still open. The queue is pipeline/state_queue.txt.
on:
  schedule:
    - cron: "11 */8 * * *"
  workflow_dispatch:
    inputs:
      state: { description: "Two-letter state code (blank = next in the queue)", default: "" }
      top: { description: "How many of the largest state parks", default: "25" }
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency: data-state
jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Pick the state
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          IN_STATE: ${{ github.event.inputs.state }}
        run: |
          OPEN=$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|startswith("data/state-"))]|length')
          if [ "$OPEN" != "0" ]; then echo "A state pull request is still open; waiting for it."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          ST="${IN_STATE:-$(head -n1 pipeline/state_queue.txt)}"
          if [ -z "$ST" ]; then echo "Queue is empty."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "state=$ST" >> "$GITHUB_OUTPUT"
      - name: Build the state
        if: steps.pick.outputs.skip != 'true'
        run: python3 build/state.py "${{ steps.pick.outputs.state }}" --top "${{ github.event.inputs.top || '25' }}" 2>&1 | tee state.log
      - name: Checks
        if: steps.pick.outputs.skip != 'true'
        run: |
          python3 build/species.py pack
          python3 build/build.py --all
          python3 build/validate.py $(ls data/*.json data-auto/*.json | grep -v -e order.json -e links.json -e species.json -e bounds.json) | tee validate.log
          ! grep -q "ERROR" validate.log
          python3 build/budget.py
      - name: Commit and open the pull request
        if: steps.pick.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ST="${{ steps.pick.outputs.state }}"
          [ -f pipeline/state_queue.txt ] && sed -i "/^$ST\$/d" pipeline/state_queue.txt || true
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/state-$ST"
          rm -f state.log.tmp; cp state.log /tmp/state.log; rm -f state.log validate.log
          git add -A
          git commit -m "State parks: $ST (pilot)"
          git push -f origin "data/state-$ST"
          { echo "Automatic batch from the data-state workflow: the largest $ST state parks, added to the pilot (data-auto). Not shown in the main app until promoted."; echo; echo '```'; tail -n 40 /tmp/state.log; echo '```'; } > body.md
          gh pr create --base main --head "data/state-$ST" --title "State parks: $ST (pilot)" --body-file body.md
          gh workflow run ci.yml --ref "data/state-$ST"
