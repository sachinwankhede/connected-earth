name: data-gbifphotos
# Manual only (#421 part B2, #511). For species the Commons job found no picture for: matches the name on GBIF and takes an observation photo under CC0 or CC BY
# (no iNaturalist, no herbarium or museum specimen sheets, an author is required), hosts the 96 px copy with its credit and opens one pull request with a 10-picture spot check.
# Shares the group of data-hostphotos: both write the same photo files.
on:
  workflow_dispatch:
    inputs:
      limit: { description: "Species titles to try (the first run: 30; 0 = all left)", default: "30" }
      again: { description: "yes = also try titles tried in the last 90 days (after a fix to the lookup)", default: "no" }
permissions:
  contents: write
  pull-requests: write
concurrency: data-hostphotos
jobs:
  gbif:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - run: pip install pillow
      - name: Find and host the pictures
        run: python3 jobs/gbifphotos.py "${{ github.event.inputs.limit || '30' }}" ${{ github.event.inputs.again == 'yes' && '--again' || '' }} | tee find.log | tail -120
      - name: Validate
        run: python3 lib/photo_registry.py validate
      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/gbifphotos-${GITHUB_RUN_ID}"
          git add photos/species photos/species.json photos/species_missing.json photos/species_source.json photos/species_gbif_tried.json photos/species_hosted.json photos/species_metadata.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          python3 - > spot.md <<'PY'
          import json, random
          src = json.load(open('photos/species_source.json')); host = json.load(open('photos/species_hosted.json')); meta = json.load(open('photos/species_metadata.json'))
          ok = sorted(t for t, s in src.items() if s == 'gbif' and t in host); random.seed(1); pick = random.sample(ok, min(10, len(ok)))
          print('| Species | Licence | Author | GBIF record |\n|---|---|---|---|')
          for t in pick:
              m = meta.get(t, {}); print('| %s | %s | %s | %s |' % (t, m.get('l', ''), (m.get('a', '') or '')[:60].replace('|', '/'), m.get('p', '')))
          print('\n%d GBIF pictures are hosted.' % len(ok))
          PY
          N=$(python3 -c "import json;print(sum(1 for v in json.load(open('photos/species_source.json')).values() if v=='gbif'))")
          git commit -m "Species pictures from GBIF: $N so far"
          git push -f origin HEAD
          { printf 'Part of #511 (#421 B2). Automatic run of data-gbifphotos, limit `%s`. Only CC0 and CC BY observation photos with a named author are kept; iNaturalist and specimen sheets are left out. %s species now have a GBIF picture.\n\nSpot check (10 random):\n\n' "${{ github.event.inputs.limit || '30' }}" "$N"; cat spot.md; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Species pictures from GBIF ($N so far)" --body-file body.md
