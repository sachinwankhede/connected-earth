name: data-dropunnamed
# Manual (#887, owner 15 Nov: "remove the pictures which don't have license information and author"). Asks Commons again for every CC BY or CC BY-SA picture whose author is unknown, removes those with no author to be found
# (places with their larger copy, species with every row), and opens ONE data pull request. A picture whose author Commons now gives is kept. The pull request lists what was removed.
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: data-dropunnamed
jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Stop while a photo pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|test("^data/(photos|dropunnamed|commons|largephoto|largeplacephoto|hostphoto|rekey)"))]|length')
          echo "open photo pull requests: $N"; echo "n=$N" >> "$GITHUB_OUTPUT"
      - name: Remove the pictures with no author
        if: steps.open.outputs.n == '0'
        run: |
          set -o pipefail
          python3 jobs/dropunnamed.py | tee drop.log | tail -120
      - name: Commit and open the pull request
        if: steps.open.outputs.n == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/dropunnamed-${GITHUB_RUN_ID}"
          git add -A photos
          if git diff --cached --quiet; then echo "nothing to remove"; exit 0; fi
          NP=$(grep -c '^place ' drop.log || true); NS=$(grep -c '^species ' drop.log || true)
          git commit -m "Remove pictures with no author: $NP places, $NS species"
          git push -f origin HEAD
          { printf 'Part of #887. Owner, 15 Nov: "remove the pictures which don'"'"'t have license information and author".\n\n**What this removes:** %s place pictures (with their larger copies) and %s species pictures that are CC BY or CC BY-SA with an unknown author and for which Commons gives no author (re-checked in this run). Places go to `missing.json` as `notfree`; species go to `species_missing.json` and Commons is not tried again for 90 days.\n\n**Sources and licences:** nothing new is added; Wikimedia Commons (commons.wikimedia.org) was only read.\n\n**Spot check (10 of them):**\n' "$NP" "$NS"; grep -E '^(place|species) ' drop.log | awk 'NR%'"$(( (NP+NS)/10 > 0 ? (NP+NS)/10 : 1 ))"'==1' | head -10 | sed 's/^/- /'; printf '\nFull list in the run log.\n\n_Generated by [Claude Code](https://claude.ai/code)_\n'; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Remove pictures with no author ($NP places, $NS species)" --body-file body.md
