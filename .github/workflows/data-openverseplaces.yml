name: data-openverseplaces
# Manual only (#768, owner 14 Nov: "goal is to get photos with correct licenses"). For US places still without a picture (photos/places/missing.json): searches Openverse for the place name and state, keeps only a result whose
# title or tags name both, with a named creator and CC0, public domain, CC BY or CC BY-SA (#421), takes Openverse's own thumbnail (never the original host), stores a 330 px JPEG and opens one pull request with a 10-picture spot check.
# dry = yes prints what would be kept and changes nothing (read every match before a real run). No secret. Shares the group of data-photos: both write photos/places.
on:
  workflow_dispatch:
    inputs:
      limit: { description: "Place titles to try (the first run: 20; 0 = all left)", default: "20" }
      dry: { description: "yes = only print the matches, write nothing and open no pull request", default: "yes" }
      again: { description: "yes = also try titles tried in the last 90 days", default: "no" }
permissions:
  contents: write
  pull-requests: write
concurrency: data-photos
jobs:
  openverse:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - run: pip install pillow
      - name: Find the pictures
        run: python3 jobs/openverseplaces.py "${{ github.event.inputs.limit || '20' }}" ${{ github.event.inputs.dry != 'no' && '--dry' || '' }} ${{ github.event.inputs.again == 'yes' && '--again' || '' }} | tee find.log | tail -120
      - name: Measure and validate
        if: github.event.inputs.dry == 'no'
        run: |
          python3 lib/photo_registry.py migrate photos/places/places.json photos/places
          python3 lib/photo_registry.py validate
      - name: Commit and open the pull request
        if: github.event.inputs.dry == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/openverseplaces-${GITHUB_RUN_ID}"
          git add photos/places photos/places_openverse_tried.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          python3 - > spot.md <<'PY'
          import json, random, subprocess
          old = json.loads(subprocess.run(['git', 'show', 'origin/main:photos/places/places.json'], capture_output=True, text=True).stdout or '{}')
          man = json.load(open('photos/places/places.json')); new = sorted(t for t in man if t not in old)
          random.seed(1); pick = random.sample(new, min(10, len(new)))
          print('| Place | Licence | Author | Openverse page |\n|---|---|---|---|')
          for t in pick:
              m = man[t]; print('| %s | %s | %s | %s |' % (t, m.get('l', ''), (m.get('a', '') or '')[:60].replace('|', '/'), m.get('p', '')))
          print('\n%d new place pictures in this run.' % len(new))
          PY
          N=$(python3 -c "import json;print(len(json.load(open('photos/places/places.json'))))")
          git commit -m "Place pictures from Openverse: $N places have one"
          git push -f origin HEAD
          { printf 'Part of #768. Automatic run of data-openverseplaces, limit `%s`. Sources: Openverse (api.openverse.org, its own thumbnail only), already allowed. Only CC0, CC BY, CC BY-SA and public domain with a named creator are kept (#421); a result must name the place and its state. %s places now have a picture.\n\nSpot check (10 random):\n\n' "${{ github.event.inputs.limit || '20' }}" "$N"; cat spot.md; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Place pictures from Openverse ($N places have one)" --body-file body.md
