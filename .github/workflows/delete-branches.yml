name: delete-branches
# One-off clean-up: deletes the branches listed in .github/branches-to-delete.txt (one per line).
# Only runs when started by hand. Never touches main or research, and skips any branch that has an open pull request.
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency: delete-branches
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete listed branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=0; skipped=0; missing=0
          while read -r b; do
            [ -z "$b" ] && continue
            case "$b" in main|research) echo "skip protected $b"; skipped=$((skipped+1)); continue;; esac
            open=$(gh api "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:$b" -q 'length')
            if [ "$open" != "0" ]; then echo "skip $b (open pull request)"; skipped=$((skipped+1)); continue; fi
            if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" >/dev/null 2>&1; then ok=$((ok+1)); else echo "not found $b"; missing=$((missing+1)); fi
          done < .github/branches-to-delete.txt
          echo "deleted=$ok skipped=$skipped not_found=$missing"
