name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate auto-generated data
        run: |
          python3 build/validate.py $(ls data/*.json data-auto/*.json | grep -v -e order.json -e links.json -e species.json -e bounds.json) | tee validate.log
          ! grep -q "ERROR" validate.log
      - name: Shared species table is current
        run: |
          python3 build/species.py pack
          git diff --exit-code -- data data-auto || (echo "Run python3 build/species.py pack and commit." && exit 1)
      - name: Build and check committed files are current
        run: |
          npm run build
          git diff --exit-code -- index.html pilot/index.html sw.js webs && test -z "$(git status --porcelain webs)" || (echo "Built files are out of date: run npm run build and commit." && exit 1)
      - name: Size budget
        run: python3 build/budget.py
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          set +e
          node --test --test-concurrency=2 --test-timeout=300000 tests/*.test.mjs > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -h "panel missing" test.log | head -2 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            grep -E "^\s*not ok" test.log | head -30 | while IFS= read -r l; do echo "::error::${l:0:180}"; done
            grep -E "^\s*(not ok|error:|message:|name:)|Error|Timeout" -A3 test.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:180}"; done
          fi
          exit $code
        env:
          CI: "1"
