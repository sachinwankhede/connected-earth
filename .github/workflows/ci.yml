name: checks
# The browser tests are skipped when a change only touches files that cannot affect the app
# (the data-job workflows, the data-job scripts in pipeline/ and build/state.py and promote*.py, docs, notes and the state queue). Changes to this file still run them.
on:
  push:
    branches: [main]
    paths-ignore: &quiet
      - ".github/workflows/data-*.yml"
      - "docs/**"
      - "CLAUDE.md"
      - "README.md"
      - "pipeline/state_queue.txt"
      - "pipeline/*.py"
      - "build/state.py"
      - "build/promote.py"
      - "build/promote_check.py"
  pull_request:
    paths-ignore: *quiet
  workflow_dispatch:
jobs:
  check:
    # The browser tests are split over three runners that work at the same time (node --test-shard); every PR still runs the whole suite.
    name: check (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate auto-generated data
        run: |
          python3 build/validate.py $(ls data/*.json data-auto/*.json | grep -v -e order.json -e links.json -e species.json -e bounds.json) | tee validate.log
          ! grep -q "ERROR" validate.log
      - name: Shared species table is current
        run: |
          python3 build/species.py pack
          git diff --exit-code -- data data-auto || (echo "Run python3 build/species.py pack and commit." && exit 1)
      - name: Build the pages (index.html, pilot, sw.js and webs are built here, not committed)
        run: npm run build
      - name: Size budget
        run: python3 build/budget.py
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          set +e
          node --test --test-concurrency=2 --test-timeout=300000 --test-shard=${{ matrix.shard }}/3 tests/*.test.mjs > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -h "panel missing" test.log | head -2 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            grep -E "^\s*not ok" test.log | head -30 | while IFS= read -r l; do echo "::error::${l:0:180}"; done
            grep -E "^\s*(not ok|error:|message:|name:)|Error|Timeout" -A3 test.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:180}"; done
          fi
          exit $code
        env:
          CI: "1"
