name: checks
# Which checks run depends on what changed (build/ci_changes.py decides; tests/jobs/ci_changes_test.py pins the rules):
#   app  (src, build, app tests, fonts, package files...): everything, including the browser tests and the Pages payload step.
#   data (data, photos, data tests, this file and pages.yml): validation, pack check, build, Pages payload step, size budgets, data tests and one smoke test.
#   job scripts (data-job scripts in jobs/, lib, job tests, state/promote tools, ci_changes.py, live_check.py): the job self-tests only.
#   docs, notes, the data-job workflows and job state files run nothing.
# The "gate" job always runs and passes when every job that was needed passed, so it is the one check to require.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.kinds.outputs.app }}
      data: ${{ steps.kinds.outputs.data }}
      jobs: ${{ steps.kinds.outputs.jobs }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: kinds
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            printf 'app=true\ndata=true\njobs=true\n' | tee -a "$GITHUB_OUTPUT"
          else
            git fetch -q origin main
            git diff --name-only origin/main...HEAD | python3 build/ci_changes.py | tee -a "$GITHUB_OUTPUT"
          fi

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # The browser tests are split over three runners that work at the same time (node --test-shard).
    name: app (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate auto-generated data
        run: |
          python3 build/validate.py $(ls data/places/*.json) | tee validate.log
          ! grep -q "ERROR" validate.log
      - name: Data format (species table, journeys, outlines, hosted pictures)
        if: ${{ !cancelled() }}   # keep going: one run reports every failing check
        run: python3 build/validate_data.py
      - name: Shared species table is current
        if: ${{ !cancelled() }}   # keep going: one run reports every failing check
        run: |
          python3 build/species.py pack
          git diff --exit-code -- data || (echo "Run python3 build/species.py pack and commit." && exit 1)
      - name: Validate photo sources and metadata
        if: ${{ !cancelled() }}   # keep going: one run reports every failing check
        run: python3 lib/photo_registry.py validate
      - name: Build the pages (index.html, pilot, sw.js and api/ are built here, not committed)
        if: ${{ !cancelled() }}   # keep going: one run reports every failing check
        run: npm run build
      - name: Stage and verify the Pages payload (the same step the deploy runs, so a build the deploy would reject fails here)
        if: ${{ !cancelled() }}   # keep going: one run reports every failing check
        run: python3 build/pages_payload.py
      - name: Size budget
        run: python3 build/budget.py
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          set +e
          node --test --test-concurrency=2 --test-timeout=300000 --test-shard=${{ matrix.shard }}/3 tests/app/*.test.mjs > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -h "panel missing" test.log | head -2 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            grep -E "^\s*not ok" test.log | head -30 | while IFS= read -r l; do echo "::error::${l:0:180}"; done
            grep -E "^\s*(not ok|error:|message:|name:)|Error|Timeout" -A3 test.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:180}"; done
          fi
          exit $code
        env:
          CI: "1"

  data:
    needs: changes
    if: needs.changes.outputs.data == 'true' && needs.changes.outputs.app != 'true'
    name: data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate auto-generated data
        run: |
          python3 build/validate.py $(ls data/places/*.json) | tee validate.log
          ! grep -q "ERROR" validate.log
      - name: Data format (species table, journeys, outlines, hosted pictures)
        if: ${{ !cancelled() }}   # keep going: one run reports every failing check
        run: python3 build/validate_data.py
      - name: Shared species table is current
        if: ${{ !cancelled() }}   # keep going: one run reports every failing check
        run: |
          python3 build/species.py pack
          git diff --exit-code -- data || (echo "Run python3 build/species.py pack and commit." && exit 1)
      - name: Validate photo sources and metadata
        if: ${{ !cancelled() }}   # keep going: one run reports every failing check
        run: python3 lib/photo_registry.py validate
      - name: Informational data-quality summary
        continue-on-error: true
        run: python3 build/data_quality.py >> "$GITHUB_STEP_SUMMARY"
      - name: Data tests
        run: |
          python3 tests/data/data_quality_test.py
          python3 tests/data/validate_data_test.py
          python3 tests/data/places_split_test.py
          python3 tests/data/species_rows_test.py
          python3 tests/data/journeydata_test.py
          node --test tests/data/*.test.mjs
      - name: Build the pages
        if: ${{ !cancelled() }}   # keep going: one run reports every failing check
        run: npm run build
      - name: Stage and verify the Pages payload (the same step the deploy runs, so a build the deploy would reject fails here)
        if: ${{ !cancelled() }}   # keep going: one run reports every failing check
        run: python3 build/pages_payload.py
      - name: Size budget
        run: python3 build/budget.py
      - run: npx playwright install --with-deps chromium
      - name: One smoke test (the app still opens with this data)
        run: node --test --test-timeout=300000 tests/app/smoke.test.mjs
        env:
          CI: "1"

  job-scripts:
    needs: changes
    if: needs.changes.outputs.jobs == 'true'
    name: job scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Job self-tests
        run: |
          python3 tests/jobs/photo_registry_test.py
          python3 tests/jobs/ci_changes_test.py
          python3 tests/jobs/live_check_test.py
          python3 tests/jobs/hostphotos_test.py
          python3 -m unittest tests/jobs/sync_test.py
          node --test tests/jobs/*.test.mjs

  gate:
    # Always runs. Passes when every needed job passed (skipped jobs were not needed).
    if: always()
    needs: [changes, app, data, job-scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c "import json,sys; n=json.load(sys.stdin); bad={k:v['result'] for k,v in n.items() if v['result'] in ('failure','cancelled')}; print(bad or 'ok'); sys.exit(1 if bad else 0)"
