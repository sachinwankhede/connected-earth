name: data-fiximgwiki
# Manual only (#908). Gives the places that share a Wikipedia title their own (gulf, ozarks, the two Harriman and the two Village Creek parks): each proposed title is accepted only when its article exists,
# is not a disambiguation page, has coordinates within the place's radius and is not used by another place. Edits `imgwiki` only. Opens ONE data pull request listing every change and the places left
# (`unresolved`) and removes the verified duplicate `sdponca` (owner decision 15 Nov: same name and 0.4 km from neponca, re-checked by the job; its file, outline and place-order entry go, nothing else refers to it). Shares the group of the photo and coordinate jobs because it edits place files.
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: data-photos
jobs:
  titles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Set the titles
        run: |
          set -o pipefail
          python3 jobs/fiximgwiki.py | tee fix.log
      - name: Validate
        run: |
          python3 build/validate.py
          python3 build/validate_data.py .
      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/fiximgwiki-${GITHUB_RUN_ID}"
          git add -A data/places data/order data/outlines
          if git diff --cached --quiet; then echo "nothing to change"; exit 0; fi
          NS=$(grep -c '^set ' fix.log || true); NU=$(grep -c '^unresolved ' fix.log || true); NR=$(grep -c '^remove ' fix.log || true)
          git commit -m "Give places that shared a Wikipedia title their own: $NS set, $NU unresolved, $NR removed"
          git push -f origin HEAD
          { printf 'Part of #908 and #887. Each place that shared its `imgwiki` with another now has its own, so `placepictures` can find it a picture.\n\n**Titles set (%s):**\n\n' "$NS"; grep '^set ' fix.log | sed 's/^set /- /'; printf '\n**Duplicates removed (%s):**\n\n' "$NR"; grep -E '^(remove|refused) ' fix.log | sed 's/^/- /' || true; printf '\n**Left alone:**\n\n'; grep -E '^unresolved ' fix.log | sed 's/^/- /' || true; printf '\n**How each title was checked:** the Wikipedia article exists, is not a disambiguation page, has a primary coordinate within 30 km of the place (600 km for the two regions, gulf and ozarks) and is not the title of another place.\n\n**Sources and licences:** Wikipedia API only (en.wikipedia.org, already in `lib/allowed_sources.json`); no pictures are added.\n\n_Generated by [Claude Code](https://claude.ai/code)_\n'; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Give places that shared a Wikipedia title their own ($NS set)" --body-file body.md
