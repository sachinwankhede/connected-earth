name: data-cleanauthors
# Manual only (#887, owner 15 Nov: "treat email as no author"). Writes the one stored form of the author (lib/author_clean.py) into photos/places/places.json: an email, a talk-page stamp,
# a web address or an "original uploader" sentence becomes the name. No network. Opens ONE data pull request listing every change. A CC BY / CC BY-SA picture whose author is only an email is
# listed as needs-author and left for data-dropunnamed.
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: data-photos
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Stop while a photo pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|test("^data/(photos|dropunnamed|commons|largephoto|largeplacephoto|hostphoto|placepictures|cleanauthors)"))]|length')
          echo "open photo pull requests: $N"; echo "n=$N" >> "$GITHUB_OUTPUT"
      - name: Clean the authors
        if: steps.open.outputs.n == '0'
        run: |
          set -o pipefail
          python3 jobs/cleanauthors.py | tee clean.log | tail -80
      - name: Validate
        if: steps.open.outputs.n == '0'
        run: python3 build/validate_data.py .
      - name: Commit and open the pull request
        if: steps.open.outputs.n == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/cleanauthors-${GITHUB_RUN_ID}"
          git add -A photos
          if git diff --cached --quiet; then echo "nothing to clean"; exit 0; fi
          NC=$(grep -c '^cleaned ' clean.log || true); NN=$(grep -c '^needs-author ' clean.log || true)
          git commit -m "Clean stored place picture authors: $NC changed"
          git push -f origin HEAD
          { printf 'Part of #887. Owner, 15 Nov: "treat email as no author".\n\n**What this changes:** %s stored authors in `photos/places/places.json` were rewritten to the one stored form (`lib/author_clean.py`): emails removed, talk-page stamps, web addresses and "original uploader" sentences reduced to the name. %s CC BY / CC BY-SA pictures have only an email as author and are left for `data-dropunnamed`.\n\n**Sources and licences:** nothing new is added and no picture changes; no network is used.\n\n**Spot check (10 of them):**\n' "$NC" "$NN"; grep '^cleaned ' clean.log | awk 'NR%'"$(( NC/10 > 0 ? NC/10 : 1 ))"'==1' | head -10 | sed 's/^/- /'; printf '\nFull list in the run log.\n\n_Generated by [Claude Code](https://claude.ai/code)_\n'; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Clean stored place picture authors ($NC)" --body-file body.md
