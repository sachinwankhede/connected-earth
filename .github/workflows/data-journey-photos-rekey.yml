name: data-journey-photos-rekey
# One-time (manual) creation of the journey cover pictures, keyed by journey id (#934, docs/DATA-PLAN.md "Journey pictures: by journey id", phase 3). Runs jobs/rekeyjourneyphotos.py, checks the
# result with the data validator, and opens ONE data pull request with the before-and-after table. Refuses while any photo pull request is open. Delete this workflow and the job file after the migration has merged.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'dry run: print the table, write nothing, open no pull request'
        default: 'yes'
        type: choice
        options: ['yes', 'no']
permissions:
  contents: write
  pull-requests: write
concurrency: data-photos
jobs:
  rekey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Stop while a photo pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|test("^data/(photos|placepictures|dropunnamed|commons|largephoto|largeplacephoto|hostphoto|species|journey|rekey)"))]|length')
          echo "open photo pull requests: $N"; echo "n=$N" >> "$GITHUB_OUTPUT"
      - name: Create the journey covers
        if: steps.open.outputs.n == '0'
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.dry }}" = "yes" ]; then python3 jobs/rekeyjourneyphotos.py dry | tee rekey.log; exit 0; fi
          python3 jobs/rekeyjourneyphotos.py | tee rekey.log
          python3 build/validate_data.py
      - name: Commit and open the pull request
        if: steps.open.outputs.n == '0' && github.event.inputs.dry == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/journey-rekey-${GITHUB_RUN_ID}"
          git add -A photos
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Journey pictures: own cover by journey id (#934)"
          git push -f origin HEAD
          { printf 'Part of #934 (and #887). One-time migration: each journey gets its own cover picture, keyed by journey id, a copy of the picture its `imgwiki` title showed (owner, 15 Nov: "Own"). A journey with no such picture is recorded in `photos/journey_missing.json` for the acquire job.\n\n'; sed -n '/^| Journey/,$p' rekey.log; printf '\n**Sources and licences:** nothing new is added; this only re-keys what is already stored.\n\n**Spot check:** the round trip is checked by the job (every journey keeps the picture it showed; a CC BY picture with no author stops the run) and by `build/validate_data.py` (0 problems).\n\n_Generated by [Claude Code](https://claude.ai/code)_\n'; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Journey pictures: own cover by journey id" --body-file body.md
