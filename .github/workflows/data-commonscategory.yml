name: data-commonscategory
# Manual only (#675). For places still in photos/places/missing.json after data-commonsnearby: finds the place's own Wikimedia Commons category (its title shares half of the place's distinctive words) and takes the first usable file in it,
# keeps only CC0, CC BY, CC BY-SA and public domain, stores the 330 px copy with its credit and opens one pull request listing every match plus a 10-picture spot check. Shares the group of data-photos.
on:
  workflow_dispatch:
    inputs:
      limit: { description: "Place titles to try (0 = all left; the owner chose a full run, 13 Nov)", default: "0" }
      again: { description: "yes = also try titles tried in the last 90 days", default: "no" }
permissions:
  contents: write
  pull-requests: write
concurrency: data-photos
jobs:
  commons:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Find the pictures
        run: python3 jobs/commonscategory.py "${{ github.event.inputs.limit || '0' }}" ${{ github.event.inputs.again == 'yes' && '--again' || '' }} | tee find.log | tail -80
      - name: Measure and validate
        run: |
          python3 lib/photo_registry.py migrate photos/places/places.json photos/places
          python3 lib/photo_registry.py validate
      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/commonscategory-${GITHUB_RUN_ID}"
          git add photos/places photos/places_category_tried.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          python3 - > spot.md <<'PY'
          import json, random, subprocess
          old = json.loads(subprocess.run(['git', 'show', 'origin/main:photos/places/places.json'], capture_output=True, text=True).stdout or '{}')
          man = json.load(open('photos/places/places.json')); new = sorted(t for t in man if t not in old)
          random.seed(1); pick = random.sample(new, min(10, len(new)))
          print('| Place | Licence | Author | File page |\n|---|---|---|---|')
          for t in pick:
              m = man[t]; print('| %s | %s | %s | %s |' % (t, m.get('l', ''), (m.get('a', '') or '')[:60].replace('|', '/'), m.get('p', '')))
          print('\n%d new place pictures in this run.' % len(new))
          PY
          N=$(python3 -c "import json;print(len(json.load(open('photos/places/places.json'))))")
          git commit -m "Place pictures from the place's own Commons category: $N places have one"
          git push -f origin HEAD
          { printf 'Part of #675. Automatic run of data-commonscategory, limit `%s`. Sources: Wikimedia Commons (category search), already allowed. Only CC0, CC BY, CC BY-SA and public domain are kept (#421); each picture is credited as any other place picture. %s places now have a picture.\n\nSpot check (10 random):\n\n' "${{ github.event.inputs.limit || '0' }}" "$N"; cat spot.md; printf '\nEvery match (place -> file, category):\n\n'; grep 'match:' find.log | sed 's/^ *match: /- /'; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Place pictures from the place's own Commons category ($N places have one)" --body-file body.md
