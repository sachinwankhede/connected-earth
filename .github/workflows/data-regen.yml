name: data-regen
# Manual only. Rebuilds the food webs of state parks that the pilot holds back for plants or links (not for too few species), using the current plant pick,
# then opens ONE pull request with a before/after table. Never promotes and never merges: run data-promote after the owner merges.
on:
  workflow_dispatch:
    inputs:
      states: { description: "Two-letter codes, comma-separated (for example AR)", default: "AR" }
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency: data-regen
jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Rebuild the held parks
        run: python3 pipeline/regen.py "${{ github.event.inputs.states }}" 2>&1 | tee regen.log
      - name: Checks
        run: |
          N=$(python3 -c "import json;print(len(json.load(open('regen.json'))['ids']))")
          [ "$N" != "0" ] || exit 0
          python3 build/species.py pack
          python3 build/build.py --all
          python3 build/validate.py $(ls data/*.json data-auto/*.json | grep -v -e order.json -e links.json -e species.json -e bounds.json) | tee validate.log
          ! grep -q "ERROR" validate.log
          python3 build/budget.py
      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(python3 -c "import json;print(len(json.load(open('regen.json'))['ids']))")
          [ "$N" != "0" ] || { echo "Nothing to rebuild."; exit 0; }
          BR="data/regen-${GITHUB_RUN_ID}"
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BR"
          mv regen.md /tmp/regen.md; rm -f regen.json regen.log validate.log
          git add -A -- . ':!pipeline/work'
          git commit -m "Rebuild food webs of held parks (${{ github.event.inputs.states }})"
          bash pipeline/syncstep.sh || true; { echo; cat /tmp/sync.md; } >> /tmp/regen.md
          git push -f origin "$BR"
          gh pr create --base main --head "$BR" --title "Rebuild food webs of held parks (${{ github.event.inputs.states }})" --body-file /tmp/regen.md
          gh workflow run ci.yml --ref "$BR"
