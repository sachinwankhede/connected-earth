name: data-promote
# Manual only. Moves the state parks that pass docs/PROMOTION.md from the pilot (data-auto) to the main app (data), repacks the species table,
# builds and checks, and opens ONE pull request with a table and a 10-link spot-check sample. Never merges: the owner merges after the spot check.
on:
  workflow_dispatch:
    inputs:
      states: { description: "Two-letter codes, comma-separated (for example AR,KY). Blank = every state park in the pilot", default: "" }
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency: data-promote
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Promote
        run: |
          S="${{ github.event.inputs.states }}"
          if [ -n "$S" ]; then python3 build/promote.py --local --state "$S" | tee promote.log; else python3 build/promote.py --local | tee promote.log; fi
          python3 build/species.py pack
          python3 build/build.py --all
          python3 build/validate.py $(ls data/*.json data-auto/*.json | grep -v -e order.json -e links.json -e species.json -e bounds.json) | tee validate.log
          ! grep -q "ERROR" validate.log
          python3 build/budget.py
          python3 pipeline/promotesummary.py promoted.json > body.md
      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(python3 -c "import json;print(len(json.load(open('promoted.json'))['moved']))")
          [ "$N" != "0" ] || { echo "Nothing passes."; exit 0; }
          BR="data/promote-${GITHUB_RUN_ID}"
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BR"
          rm -f promote.log validate.log promoted.json
          git add -A -- . ':!body.md' ':!pipeline/work'
          git commit -m "Promote $N state parks to the main app (${{ github.event.inputs.states || 'all pilot states' }})"
          git push -f origin "$BR"
          gh pr create --base main --head "$BR" --title "Promote $N state parks (${{ github.event.inputs.states || 'all pilot states' }})" --body-file body.md
          gh workflow run ci.yml --ref "$BR"
