name: data-photos-rekey
# Manual, ONE time (#887, docs/DATA-PLAN.md step 3, phase 3). Rewrites the place-picture files from Wikipedia-title keys to place-id keys (photos/places/places.json, missing.json, photos/places_large.json, one ledger photos/places_tried.json),
# renames files to <id>.jpg / <id>.webp, removes the picture of a shared title (two places, one record), removes files no list mentions, proves the round trip, and opens ONE data pull request with the before and after table. No network.
# Run it only with the photo workflows quiet: the owner must set `photos_paused` to "yes" (nothing else is checked for him). It also refuses while a photo pull request is open.
on:
  workflow_dispatch:
    inputs:
      photos_paused: { description: "Type yes to confirm the photo workflows are paused and no photo pull request is open", default: "no" }
permissions:
  contents: write
  pull-requests: write
concurrency: data-photos-rekey
jobs:
  rekey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Refuse unless the photo workflows are paused
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.inputs.photos_paused }}" != "yes" ]; then echo "photos_paused is not yes: stopping"; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          N=$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|test("^data/(photos|dropunnamed|commons|largephoto|largeplacephoto|hostphoto|openverse|rekey|droppictures|fixcoords)"))]|length')
          echo "open photo pull requests: $N"
          if [ "$N" != "0" ]; then echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Rekey the place pictures
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -o pipefail
          python3 jobs/rekeyplacephotos.py | tee rekey.log
      - name: Validate the new files
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -o pipefail
          python3 build/validate_data.py | tail -20
      - name: Commit and open the pull request
        if: steps.gate.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/rekey-${GITHUB_RUN_ID}"
          git add -A photos
          if git diff --cached --quiet; then echo "nothing to change"; exit 0; fi
          git commit -m "Place pictures keyed by place id (migration)"
          git push -f origin HEAD
          { printf 'Part of #887 (`docs/DATA-PLAN.md`, step 3, phase 3). Automatic run of data-photos-rekey: the place-picture files are now keyed by place id.\n\n**Sources and licences:** nothing new; the same pictures, credits and licences, only the keys, file names and one ledger change.\n\n**Before and after:**\n\n'; sed -n '/^| file | before | after |/,/^rows left out/p' rekey.log; printf '\n**Proof:** the job unkeys the new files and compares them with the old rows for every unshared place (it fails otherwise), then runs `PlacePhotos.check()` (files and lists agree) and `build/validate_data.py`; both passed in this run.\n\n**Spot check (10 places):**\n'; python3 -c "import json; P = json.load(open('photos/places/places.json')); ks = sorted(P)[::max(1, len(P) // 10)][:10]; [print('- %s (%s): %s, %s, %s' % (k, P[k].get('wiki'), P[k].get('f'), P[k].get('a') or 'author unknown', P[k].get('l'))) for k in ks]"; printf '\n**Do not resume the photo workflows after merging** until the writers read this shape (phase 4); until then they would write the old title-keyed files again.\n\n_Generated by [Claude Code](https://claude.ai/code)_\n'; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Place pictures keyed by place id (migration)" --body-file body.md
