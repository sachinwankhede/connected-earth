name: data-node-pictures-migrate
# One-time (manual) creation of the node pictures, keyed by node id (#976 step A, docs/DATA-PLAN.md "Credits"). Runs jobs/nodepictures_migrate.py (additive: nothing in the species data changes), checks the
# result with the data validator, and opens ONE data pull request with the table of node ids. Refuses while any photo pull request is open. Delete this workflow and the job file after the migration has merged.
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'dry run: print the table, write nothing, open no pull request'
        default: 'yes'
        type: choice
        options: ['yes', 'no']
permissions:
  contents: write
  pull-requests: write
concurrency: data-photos
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Stop while a photo pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|test("^data/(photos|placepictures|dropunnamed|commons|largephoto|largeplacephoto|hostphoto|species|journey|rekey|node)"))]|length')
          echo "open photo pull requests: $N"; echo "n=$N" >> "$GITHUB_OUTPUT"
      - name: Create the node pictures
        if: steps.open.outputs.n == '0'
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.dry }}" = "yes" ]; then python3 jobs/nodepictures_migrate.py dry | tee migrate.log; exit 0; fi
          python3 jobs/nodepictures_migrate.py | tee migrate.log
          python3 build/validate_data.py
      - name: Commit and open the pull request
        if: steps.open.outputs.n == '0' && github.event.inputs.dry == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/node-pictures-${GITHUB_RUN_ID}"
          git add -A photos
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Node pictures: one record per concept, by node id (#976)"
          git push -f origin HEAD
          { printf 'Part of #976 (and #934, #887). One-time migration: the pictures filed in `photos/species_pictures.json` as species rows for node labels (`sk: resource`: `desert-soil`, `summer-sunlight`, ...) get one record per concept in `photos/node_pictures.json`, keyed by node id (the slug of the concept title), with the 192 px tile in `photos/nodes/`. Additive: no species row, picture or file is changed or removed.\n\n'; sed -n '/^| Node id/,$p' migrate.log; printf '\n**Sources and licences:** nothing new is added; this only copies what is already stored (Wikimedia Commons pictures with their stored credit).\n\n**Spot check:** the round trip is checked by the job (every resource row shows the same credit through its node id; a CC BY picture with no author stops the run) and by `build/validate_data.py` (0 problems).\n\n_Generated by [Claude Code](https://claude.ai/code)_\n'; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Node pictures: one record per concept, by node id" --body-file body.md
