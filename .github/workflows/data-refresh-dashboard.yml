name: data-refresh-dashboard
# The ONE job that refreshes the data behind the status page (#1183, owner: "Yes", 25 Nov). It chains the two audit files that need the web and are not rebuilt at deploy:
# jobs/identity.py (data/audit/identity.json: the Wikidata item of every row's page) and jobs/rowtitles.py --all (data/audit/rowtitles.json: what each row should be called),
# then prints the counts of jobs/identitycheck.py (rows on a page of the wrong rank) into the pull request. One pull request, only those two files. It changes no row.
# Everything else on /status/ (counts of pictures, outlines, orphan node entries, food webs) is read from the checkout when the page is built at deploy and needs no job here;
# data/audit/strictrows.json is written only by data-strictrows when rows are removed. Hosts: en.wikipedia.org and www.wikidata.org, already in lib/allowed_sources.json (through lib/wm.py).
# Weekly (Wednesday 04:23 UTC, away from the Saturday picture run and the Monday read-only audit) and by hand. Nothing starts while another identity, row-name or strict-rows pull request is open.
on:
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: data-refresh-dashboard
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Stop while a related pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|test("^data/(dashboard|identity|rowtitles|strictrows)"))]|length')
          echo "open related pull requests: $N"; echo "n=$N" >> "$GITHUB_OUTPUT"
      - name: Row identity (Wikipedia and Wikidata)
        if: steps.open.outputs.n == '0'
        run: python3 jobs/identity.py --json data/audit/identity.json | tee identity.txt | head -3
      - name: Row names (Wikipedia and Wikidata)
        if: steps.open.outputs.n == '0'
        run: python3 jobs/rowtitles.py --all --json data/audit/rowtitles.json | tee rowtitles.txt | head -3
      - name: Commit and open the pull request
        if: steps.open.outputs.n == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/dashboard-${GITHUB_RUN_ID}"
          git add data/audit/identity.json data/audit/rowtitles.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          python3 jobs/identitycheck.py | tee check.txt
          python3 - > spot.md <<'PY'
          import json, random
          d = json.load(open('data/audit/identity.json'))['rows']; random.seed(1)
          print('| Row | Item | Rank | Taxon | Kind | Why |\n|---|---|---|---|---|---|')
          for k in random.sample(sorted(d), min(10, len(d))): print('| %s | %s |' % (k, ' | '.join(d[k])))
          PY
          N=$(python3 -c "import json;print(len(json.load(open('data/audit/identity.json'))['rows']))")
          git commit -m "Refresh the status page data: identity and row names ($N rows)"
          git push -f origin HEAD
          { printf 'Part of #1183. Automatic run of data-refresh-dashboard on %s rows. Sources: English Wikipedia page titles and Wikidata labels and items (titles, labels and ids only, no text is copied), through lib/wm.py (hosts listed in lib/allowed_sources.json). It changes no row; only `data/audit/identity.json` and `data/audit/rowtitles.json`.\n\n**Identity run:**\n\n```\n' "$N"; head -3 identity.txt; printf '```\n\n**Row names run:**\n\n```\n'; head -3 rowtitles.txt; printf '```\n\n**Rows on a page of the wrong rank (jobs/identitycheck.py, shown on the status page):**\n\n```\n'; cat check.txt; printf '```\n\n**Spot check (10 rows, identity):**\n\n'; cat spot.md; printf '\n_Generated by [Claude Code](https://claude.ai/code)_\n'; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Status page data: identity and row names ($N rows)" --body-file body.md
