name: data-largeplacephotos
# Manual (#727, owner 14 Nov). Makes a 400 px WebP copy of each place picture that has none yet, into photos/places-lg/, and opens ONE data pull request. Credits and licences are the existing ones (photos/places/places.json).
# Resumable: places already done are skipped, so a later run with a larger number adds more. Does nothing while an earlier largeplacephotos pull request is open (two would clash on photos/places_large.json).
on:
  workflow_dispatch:
    inputs:
      limit: { description: "Most new copies in this run (0 = no limit; first batch: 30)", default: "30" }
permissions:
  contents: write
  pull-requests: write
concurrency: data-largeplacephotos
jobs:
  large:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Stop while an earlier pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|startswith("data/largeplacephotos-"))]|length')
          echo "open largeplacephotos pull requests: $N"; echo "n=$N" >> "$GITHUB_OUTPUT"
      - if: steps.open.outputs.n == '0'
        run: pip install pillow
      - name: Make the larger copies
        if: steps.open.outputs.n == '0'
        run: |
          set -o pipefail   # a crash of the job must fail the step, not be hidden by tee and tail
          python3 jobs/largeplacephotos.py "${{ github.event.inputs.limit }}" | tee large.log | tail -60
      - name: Commit and open the pull request
        if: steps.open.outputs.n == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/largeplacephotos-${GITHUB_RUN_ID}"
          git add photos/places-lg photos/places_large.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          N=$(python3 -c "import json;print(len(json.load(open('photos/places_large.json'))))"); SZ=$(du -sk photos/places-lg | cut -f1)
          git commit -m "Larger place pictures: $N so far (${SZ} KB)"
          git push -f origin HEAD
          python3 - > spot.md <<'PY'
          import json
          L = json.load(open('photos/places_large.json')); P = json.load(open('photos/places/places.json'))
          ks = sorted(L)[::max(1, len(L) // 10)][:10]
          for k in ks: print('- %s: %s, %s, %s' % (k, L[k], P[k].get('a') or 'author unknown', P[k].get('l')))
          PY
          { printf 'Part of #727. Automatic run of data-largeplacephotos: %s larger place pictures (400 px WebP), %s KB together (about %s KB each).\n\n**Sources and licences:** Wikimedia Commons thumbnails (upload.wikimedia.org), the same pictures already hosted at 330 px; credit and licence are the existing ones in `photos/places/places.json` (CC0, CC BY, CC BY-SA, public domain). Nothing new is credited.\n\n**Spot check (10 of them, spread over the list):**\n' "$N" "$SZ" "$((SZ / N))"; cat spot.md; printf '\nThe size of every file is in the run log.\n\n_Generated by [Claude Code](https://claude.ai/code)_\n'; } > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Larger place pictures ($N so far)" --body-file body.md
