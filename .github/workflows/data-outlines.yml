name: data-outlines
# Weekly (Wednesday 03:37 UTC) and by hand. Tries again for the park outlines that are missing (PAD-US, US Geological Survey, then Wikidata and OpenStreetMap), for every park or for the ids given,
# writes each outline's credit record (data/outline_records.json) and the misses with their retry delay (data/outline_missing.json, #977), and opens one pull request with the new files and a list of the
# parks that still have none. A run does nothing while an outline pull request is open. Nothing reaches the live site until it is merged.
on:
  schedule:
    - cron: '37 3 * * 3'
  workflow_dispatch:
    inputs:
      ids: { description: "Place ids, space-separated. Blank = every US park without an outline", default: "" }
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency: data-outlines
jobs:
  outlines:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Stop while an outline pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh pr list --state open --json headRefName --jq '[.[]|select(.headRefName|test("^data/(outline|bounds)"))]|length')
          echo "open outline pull requests: $N"; echo "n=$N" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        if: steps.open.outputs.n == '0'
        with: { node-version: 22, cache: npm }
      - if: steps.open.outputs.n == '0'
        run: npm ci
      - name: Fetch the missing outlines from PAD-US (US parks)
        if: steps.open.outputs.n == '0'
        run: python3 jobs/bounds.py ${{ github.event.inputs.ids }} | tee outlines.log
      - name: Try Wikidata and OpenStreetMap for the rest (and record every outline)
        if: steps.open.outputs.n == '0'
        run: python3 jobs/bounds_more.py ${{ github.event.inputs.ids }} | tee outlines_more.log
      - name: Check the data and the size budget
        if: steps.open.outputs.n == '0'
        run: |
          python3 build/validate_data.py
          python3 build/species.py pack
          python3 build/build.py --all
          python3 build/budget.py
      - name: Commit and open the pull request
        if: steps.open.outputs.n == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="data/outlines-${GITHUB_RUN_ID}"
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "$BR"
          # the list of places still without an outline is always kept on the branch data/outlines-report (no pull request), so it can be read
          git stash -q -u -- jobs/reports/outlines_missing.md; git checkout -q -B data/outlines-report; git stash pop -q
          git add -f jobs/reports/outlines_missing.md; git commit -qm "Places without an outline" || true; git push -q -f origin data/outlines-report
          git checkout -q -B "$BR" origin/main 2>/dev/null || git checkout -q -B "$BR" main
          git add -A -- data/outlines
          if git diff --cached --quiet; then echo "No new outlines (a weekly run that finds none opens no pull request; the misses are tried again after their delay)."; exit 0; fi
          git add -A -- data/outline_records.json data/outline_missing.json
          N=$(git diff --cached --name-only | wc -l)
          git commit -m "Park outlines: $N more"
          bash jobs/syncstep.sh || true
          git push -f origin "$BR"
          { echo "Automatic run of the data-outlines workflow: $N new outlines (PAD-US for US parks, then Wikidata/Commons and OpenStreetMap; each file says which in its s key)."; echo; echo "Places still without an outline are listed in jobs/reports/outlines_missing.md on the branch data/outlines-report."; echo; grep -h '^ok' outlines_more.log | head -80 | sed 's/^/- /'; echo; cat /tmp/sync.md; } > /tmp/body.md
          gh pr create --base main --head "$BR" --title "Park outlines: $N more" --body-file /tmp/body.md
          gh workflow run ci.yml --ref "$BR"
