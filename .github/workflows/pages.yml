name: deploy
# Publishes the site only after the quick build checks pass, so a broken build never goes live.
# (The slower browser tests run in the "checks" workflow on every pull request and on main.)
# Needs Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate data
        run: |
          python3 build/validate.py $(ls data/places/*.json) | tee validate.log
          ! grep -q "ERROR" validate.log
      - name: Build the pages (not committed; built here so the site always matches the source)
        run: npm run build
      - name: Size budget
        run: python3 build/budget.py
      - name: The built page loads
        run: test -s index.html && grep -q "Connected Earth" index.html
      - name: Stage and verify the Pages payload
        run: python3 build/pages_payload.py
      - name: The build stamp (the live site is compared with it after the deploy)
        id: stamp
        run: |
          stamp=$(grep -o 'const V = "[0-9a-f]*"' sw.js | grep -o '[0-9a-f]\{8\}')
          test -n "$stamp"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - name: Rehearse the live-site check on the staged payload
        run: |
          (cd dist/pages && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          python3 build/live_check.py http://127.0.0.1:8765/ "${{ steps.stamp.outputs.stamp }}" --tries 3 --wait 2
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/pages }
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.d.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  live:
    # After the site is published: fetch the live sw.js and index.html, compare their build stamp with the one just built, and check
    # that the key data files answer (build/live_check.py). Pages can take a minute or two to switch over, so it retries for 3 minutes.
    # A failure here fails the run, and the alert job below then opens the "Deploy failing" issue.
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: The live site is the build just deployed
        env:
          URL: ${{ needs.deploy.outputs.url || 'https://sachinwankhede.github.io/connected-earth/' }}
          STAMP: ${{ needs.verify.outputs.stamp }}
        run: python3 build/live_check.py "$URL" "$STAMP" --tries 18 --wait 10
  alert:
    # Keeps one issue "Deploy failing" in step with the deploy: opened (or commented on) when any job above failed, closed when a deploy succeeds.
    # A cancelled run (a newer push replaced it) changes nothing.
    needs: [verify, deploy, live]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      RESULTS: ${{ needs.verify.result }} ${{ needs.deploy.result }} ${{ needs.live.result }}
    steps:
      - name: Open, update or close the "Deploy failing" issue
        run: |
          echo "job results: $RESULTS"
          open=$(gh api "repos/$REPO/issues?state=open&labels=theme:process&per_page=100" --jq '[.[] | select(.title == "Deploy failing")][0].number // empty')
          case " $RESULTS " in
            *" failure "*)
              body="The deploy failed for commit \`${SHA:0:7}\`: $RUN_URL
          Job results (verify, deploy, live): $RESULTS. Read the log of the failed job."
              if [ -n "$open" ]; then
                gh api "repos/$REPO/issues/$open/comments" -f body="Failed again for commit \`${SHA:0:7}\`: $RUN_URL ($RESULTS)"
              else
                gh api "repos/$REPO/issues" -f title="Deploy failing" -f 'labels[]=theme:process' -f body="$body
          This issue closes by itself when a deploy succeeds."
              fi ;;
            " success success success ")
              if [ -n "$open" ]; then
                gh api "repos/$REPO/issues/$open/comments" -f body="Deploy succeeded for commit \`${SHA:0:7}\`: $RUN_URL. Closing."
                gh api -X PATCH "repos/$REPO/issues/$open" -f state=closed -f state_reason=completed
              fi ;;
            *) echo "cancelled or skipped: nothing to do" ;;
          esac
