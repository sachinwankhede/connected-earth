name: deploy
# Publishes the site only after the quick build checks pass, so a broken build never goes live.
# (The slower browser tests run in the "checks" workflow on every pull request and on main.)
# Needs Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate data
        run: |
          python3 build/validate.py $(ls data/places/*.json) | tee validate.log
          ! grep -q "ERROR" validate.log
      - name: Build the pages (not committed; built here so the site always matches the source)
        run: npm run build
      - name: Size budget
        run: python3 build/budget.py
      - name: The built page loads
        run: test -s index.html && grep -q "Connected Earth" index.html
      - name: Stage and verify the Pages payload
        run: python3 build/pages_payload.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist/pages }
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.d.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  live:
    # After the site is published: load it as a visitor would and fail loudly if a file is missing. Pages can take a minute or two to switch over, so it retries for 3 minutes.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: The live site serves the page and its data files
        env:
          URL: ${{ needs.deploy.outputs.url || 'https://sachinwankhede.github.io/connected-earth/' }}
        run: |
          U="${URL%/}/"
          fail=1
          for i in $(seq 1 18); do
            ok=1
            curl -fsS "$U" | grep -q "Connected Earth" || ok=0
            curl -fsS "${U}pilot/" | grep -q "Connected Earth" || ok=0
            curl -fsS "${U}api/yellowstone.json" | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['nodes'])>5" || ok=0
            curl -fsS "${U}api/species/abies-balsamea.json" | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['t'])>30" || ok=0
            curl -fsS "${U}sw.js" | grep -q "atlas-shell-" || ok=0
            [ $ok = 1 ] && { fail=0; break; }
            echo "not ready yet (try $i)"; sleep 10
          done
          [ $fail = 0 ] && echo "Live site OK: $U" || { echo "::error::The live site is missing files after deploy: $U"; exit 1; }
  alert:
    # Keeps one issue "Deploy failing" in step with the deploy: opened (or commented on) when any job above failed, closed when a deploy succeeds.
    # A cancelled run (a newer push replaced it) changes nothing.
    needs: [verify, deploy, live]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      RESULTS: ${{ needs.verify.result }} ${{ needs.deploy.result }} ${{ needs.live.result }}
    steps:
      - name: Open, update or close the "Deploy failing" issue
        run: |
          echo "job results: $RESULTS"
          open=$(gh api "repos/$REPO/issues?state=open&labels=theme:process&per_page=100" --jq '[.[] | select(.title == "Deploy failing")][0].number // empty')
          case " $RESULTS " in
            *" failure "*)
              body="The deploy failed for commit \`${SHA:0:7}\`: $RUN_URL
          Job results (verify, deploy, live): $RESULTS. Read the log of the failed job."
              if [ -n "$open" ]; then
                gh api "repos/$REPO/issues/$open/comments" -f body="Failed again for commit \`${SHA:0:7}\`: $RUN_URL ($RESULTS)"
              else
                gh api "repos/$REPO/issues" -f title="Deploy failing" -f 'labels[]=theme:process' -f body="$body
          This issue closes by itself when a deploy succeeds."
              fi ;;
            " success success success ")
              if [ -n "$open" ]; then
                gh api "repos/$REPO/issues/$open/comments" -f body="Deploy succeeded for commit \`${SHA:0:7}\`: $RUN_URL. Closing."
                gh api -X PATCH "repos/$REPO/issues/$open" -f state=closed -f state_reason=completed
              fi ;;
            *) echo "cancelled or skipped: nothing to do" ;;
          esac
