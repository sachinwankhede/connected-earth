name: data-states
# Manual only. Builds several US states one after another on ONE branch and opens ONE pull request with a table per state
# (parks built, passing, held, duplicates dropped, outlines missing). A state that fails is skipped and listed; the rest carry on.
# Same steps as data-state for each state. Never merges. Shares the data-state concurrency group, so it never overlaps a single-state run.
on:
  workflow_dispatch:
    inputs:
      states: { description: "Two-letter codes, comma-separated (for example AR,KY,TN)", required: true }
      top: { description: "How many of the largest state parks per state", default: "25" }
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency: data-state
jobs:
  states:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the states one after another
        env:
          STATES: ${{ github.event.inputs.states }}
          TOP: ${{ github.event.inputs.top || '25' }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          BR="data/states-${GITHUB_RUN_ID}"; git checkout -B "$BR"
          mkdir -p /tmp/logs; : > /tmp/summary.tsv
          for ST in $(echo "$STATES" | tr ',' ' ' | tr 'a-z' 'A-Z'); do
            echo "=== $ST"; git reset -q --hard HEAD; git clean -fdq -e pipeline/work
            if python3 build/state.py "$ST" --top "$TOP" > "/tmp/logs/$ST.log" 2>&1; then
              [ -f pipeline/state_queue.txt ] && sed -i "/^$ST\$/d" pipeline/state_queue.txt || true
              git add -A -- . ':!pipeline/work'; git commit -qm "State parks: $ST (pilot)"; echo "$ST ok" >> /tmp/summary.tsv
            else
              echo "$ST FAILED" >> /tmp/summary.tsv; tail -n 5 "/tmp/logs/$ST.log"
            fi
          done
      - name: Checks
        run: |
          python3 build/species.py pack
          python3 build/build.py --all
          python3 build/validate.py $(ls data/*.json data-auto/*.json | grep -v -e order.json -e links.json -e species.json -e bounds.json) | tee validate.log
          ! grep -q "ERROR" validate.log
          python3 build/budget.py | tee budget.log
      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="data/states-${GITHUB_RUN_ID}"
          git add -A -- . ':!pipeline/work' ':!validate.log' ':!budget.log'; git diff --cached --quiet || git commit -qm "Species table and outlines packed"
          python3 pipeline/statesummary.py /tmp/summary.tsv /tmp/logs budget.log > body.md
          git push -f origin "$BR"
          gh pr create --base main --head "$BR" --title "State parks: $(cut -d' ' -f1 /tmp/summary.tsv | tr '\n' ' ')(pilot batch)" --body-file body.md
          gh workflow run ci.yml --ref "$BR"
