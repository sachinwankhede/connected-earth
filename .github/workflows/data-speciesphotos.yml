name: data-speciesphotos
# Manual only. Looks up Wikimedia thumbnail links for species and opens a human-reviewable pull request.
# Existing manifest shape is retained; new candidates are limited to Wikimedia and nothing reaches the live site until the pull request is merged.
on:
  workflow_dispatch:
    inputs:
      limit: { description: "Titles to try (0 = all left)", default: "0" }
permissions:
  contents: write
  pull-requests: write
concurrency: data-speciesphotos
jobs:
  species:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - name: Look up the thumbnails
        run: python3 pipeline/speciesphotos.py photos/species.json "${{ github.event.inputs.limit || '0' }}" | tee speciesphotos.log | tail -5
      - name: Validate photo sources and legacy metadata
        run: python3 pipeline/photo_registry.py validate
      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/speciesphotos-${GITHUB_RUN_ID}"
          git add photos/species.json photos/species_missing.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          N=$(python3 -c "import json;print(len(json.load(open('photos/species.json'))))"); M=$(python3 -c "import json;print(len(json.load(open('photos/species_missing.json'))))")
          git commit -m "Species photo links: $N found, $M with no picture"
          git push -f origin HEAD
          python3 - > body.md <<'PY'
          import json, random
          m = json.load(open('photos/species.json')); random.seed(1)
          print('Automatic run of data-speciesphotos. Thumbnail links only; the app does not use the file until it is wired in. Sample of 10 to spot check:')
          for k, v in random.sample(sorted(m.items()), 10): print('- https://en.wikipedia.org/wiki/' + v[1])
          PY
          gh pr create --base main --head "$(git branch --show-current)" --title "Species photo links ($N found, $M with no picture)" --body-file body.md
