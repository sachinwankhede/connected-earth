name: data-largephotos
# Manual only (#421 part A). Makes a 400 px WebP copy of the picture of the species found in the most places, into photos/species-lg/, and opens one pull request.
# Credits and licences are the existing ones (photos/species_metadata.json). Resumable: species already done are skipped, so a later run with a larger number adds more.
on:
  workflow_dispatch:
    inputs:
      top: { description: "How many of the most-used species (the first run: 30; the first batch: 500)", default: "30" }
permissions:
  contents: write
  pull-requests: write
concurrency: data-largephotos
jobs:
  large:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - run: pip install pillow
      - name: Make the larger copies
        run: python3 jobs/largephotos.py "${{ github.event.inputs.top || '30' }}" | tee large.log | tail -60
      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "connected-earth-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B "data/largephotos-${GITHUB_RUN_ID}"
          git add photos/species-lg photos/species_large.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          N=$(python3 -c "import json;print(len(json.load(open('photos/species_large.json'))))"); SZ=$(du -sk photos/species-lg | cut -f1)
          git commit -m "Larger species pictures: $N so far (${SZ} KB)"
          git push -f origin HEAD
          printf 'Part of #421 (part A). Automatic run of data-largephotos for the %s most-used species. %s larger copies (400 px WebP) in total, %s KB. Credits and licences are the existing ones. The log of the run (size of every file) is in the run.\n\n_Generated by [Claude Code](https://claude.ai/code)_\n' "${{ github.event.inputs.top || '30' }}" "$N" "$SZ" > body.md
          gh pr create --base main --head "$(git branch --show-current)" --title "Larger species pictures ($N so far)" --body-file body.md
